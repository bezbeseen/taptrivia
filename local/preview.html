<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SLAP 15</title>
</head>
<body style="margin:0">
<script>
(async()=>{
  try{
    let app=await fetch('app.html?'+Date.now()).then(r=>{if(!r.ok)throw new Error('Could not load app shell.');return r.text()});
    const scripts=`\n<script src="questions-data-1.js"><\/script>\n<script src="questions-data-2.js"><\/script>\n<script src="questions-data-3.js"><\/script>\n<script src="questions-data-4.js"><\/script>\n<script src="questions-data-5.js"><\/script>\n<script src="questions-data-6.js"><\/script>\n<script src="questions-loader.js"><\/script>\n`;
    app=app.replace(/<\/div>\s*$/i,scripts+'</div>');
    document.open();
    document.write(app);
    document.close();
  }catch(err){document.body.innerHTML='<pre style="padding:20px;font-family:system-ui">'+err.message+'</pre>'}
})();
</script>
</body>
</html>
